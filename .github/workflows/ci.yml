name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app (universal)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/Sweep.app build/Sweep.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sweep
          path: build/Sweep.zip

      # Keeps one rolling "latest-build" pre-release with the newest app, for easy installs.
      - name: Publish latest build
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build build/Sweep.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Sweep latest build" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Ad-hoc signed, not notarized. Install with scripts/install.sh."
